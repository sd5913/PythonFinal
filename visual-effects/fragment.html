<div id="dark-effects-release">
  <div class="fx-heading"><h2>深空乱斗 · 特效 1.0</h2><button class="btn btn-primary" type="button" disabled id="fx-play-all">全部播放</button></div>
  <div class="viz-controls fx-selectors"><label class="form-label">舰队颜色<select id="fx-color" aria-label="舰队颜色" class="form-select" disabled><option value="blue">蓝色空间 · 蓝</option><option value="gray">自然选择 · 灰</option><option value="red">企业 · 红</option><option value="yellow">终极规律 · 黄</option></select></label><label class="form-label">舰船编号<select id="fx-number" aria-label="舰船编号" class="form-select" disabled><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div><div class="fx-scenes">
    <section class="fx-scene" data-effect="ship_energy_pickup"><div class="fx-label"><h3>拾取能量</h3><button class="btn" type="button" disabled>重播</button></div><canvas width="960" height="520" role="img" aria-label="舰体自身闪烁一次蓝光"></canvas><div class="fx-caption text-small text-muted">舰体蓝光一闪</div></section>
    <section class="fx-scene" data-effect="ship_hit"><div class="fx-label"><h3>受到攻击</h3><button class="btn" type="button" disabled>重播</button></div><canvas width="960" height="520" role="img" aria-label="舰船数字中心迸出卡通闪光和火花"></canvas><div class="fx-caption text-small text-muted">数字中心闪光 · 短促火花</div></section>
    <section class="fx-scene" data-effect="ship_collision_destroy"><div class="fx-label"><h3>舰船碰撞</h3><button class="btn" type="button" disabled>重播</button></div><canvas width="960" height="520" role="img" aria-label="两舰重叠后爆炸，画面短促震动，随后移除两舰，爆炸烟团继续消散"></canvas><div class="fx-caption text-small text-muted">重叠爆炸 · 震动 · 两舰移除</div></section>
    <section class="fx-scene" data-effect="droplet_move"><div class="fx-label"><h3>水滴移动</h3><button class="btn" type="button" disabled>重播</button></div><canvas width="960" height="520" role="img" aria-label="水滴起点由中心散开蓝白光团，伴随短促放射光束和碎光爆发，随后柔光长尾迹随行"></canvas><div class="fx-caption text-small text-muted">中心光团爆发 · 放射碎光 · 长尾迹</div></section>
    <section class="fx-scene" data-effect="ship_detected"><div class="fx-label"><h3>被探测到</h3><button class="btn" type="button" disabled>重播</button></div><canvas width="960" height="520" role="img" aria-label="扫描光经过舰体，网格浮现后消失"></canvas><div class="fx-caption text-small text-muted">扫描掠过 · 舰体网格浮现</div></section>
    <section class="fx-scene" data-effect="ship_move"><div class="fx-label"><h3>舰船移动</h3><button class="btn" type="button" disabled>重播</button></div><canvas width="960" height="520" role="img" aria-label="舰船沿弧线移动，留下逐渐消失的推进尾迹"></canvas><div class="fx-caption text-small text-muted">短推进焰 · 路径尾迹渐隐</div></section>
  </div>
  <p class="fx-status text-small text-muted" role="status" aria-live="polite">正在加载四色舰船素材…</p>
</div>
